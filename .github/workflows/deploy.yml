name: Build and Deploy

# Fetches the latest Kobo data and publishes the dashboard to GitHub Pages,
# hourly and on every merge to main. The data goes straight into the published
# site - nothing is committed back to the repository, so this works with the
# protected main branch.
on:
  push:
    branches: [main]
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs (GitHub's standard Pages setup): the
  # site package is only fully saved when the build job ends, so deploying in
  # the same job sometimes failed with "No artifacts named github-pages".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Start from the data currently live on the site, so a Kobo outage keeps
      # the last good data rather than going back to the repo's older snapshot.
      - name: Start from the last published data
        run: |
          for f in data.json roster.json; do
            curl -sfL "https://ehealthafrica.github.io/field_team_dashboard/data/$f" -o "data/$f.live" \
              && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "data/$f.live" \
              && mv "data/$f.live" "data/$f" || rm -f "data/$f.live"
          done

      # Refresh from Kobo. If Kobo is unavailable the deploy still goes ahead
      # with the data above, so a temporary outage does not fail the run.
      - name: Fetch latest data from KoboToolbox
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: python3 fetch_data.py || echo "::warning::Kobo fetch failed - publishing the last available data"

      - name: Copy data into the site
        run: |
          mkdir -p public/data
          cp data/*.json public/data/

      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
