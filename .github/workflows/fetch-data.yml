name: Fetch KoboToolbox Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from KoboToolbox
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: python3 fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Someone may have pushed while the fetch ran - catch up and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git pull --rebase origin main
          done
          exit 1
